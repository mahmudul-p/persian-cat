<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Persian Cat Preview</title>
<style>
  body { margin: 0; height: 100vh; background: #1e1e1e; color: #d4d4d4; font: 14px/1.6 Menlo, monospace; overflow: hidden; }
  pre { margin: 0; padding: 48px 24px; }
  .bar { position: fixed; top: 0; left: 0; right: 0; padding: 8px; background: #252526; display: flex; gap: 6px; flex-wrap: wrap; z-index: 1; }
  button { background: #0e639c; color: #fff; border: 0; padding: 4px 10px; border-radius: 3px; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<pre>
<span style="color:#569cd6">function</span> <span style="color:#dcdcaa">fibonacci</span>(n) {
  <span style="color:#c586c0">if</span> (n &lt; 2) <span style="color:#c586c0">return</span> n;
  <span style="color:#c586c0">return</span> fibonacci(n - 1) + fibonacci(n - 2);
}
<span style="color:#6a9955">// Wiggle the mouse to play with the cat. Buttons trigger behaviours.</span>
</pre>
<script>window.__PERSIAN_CAT__ = { size: 220, frequency: 'often', mouseInteraction: true, firstDelay: 0.2 };</script>
<script src="media/cat.js"></script>
<script>
  for (const n of ['wander','idle','lookAround','sit','groom','scratch','yawn','stretch','sleep','zoomies','leap','chase','pounce','startle','leave']) {
    const b = document.createElement('button'); b.textContent = n; b.onclick = () => __persianCat.play(n); bar.appendChild(b);
  }
</script>
</body>
</html>
